# 宝塔中创建 wedding.nczkevin.com 站点后，将 HTTPS 证书路径替换为宝塔生成的实际路径。
server {
    listen 80;
    server_name wedding.nczkevin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wedding.nczkevin.com;

    ssl_certificate     /www/server/panel/vhost/cert/wedding.nczkevin.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wedding.nczkevin.com/privkey.pem;

    root /www/wwwroot/wedding.nczkevin.com/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
